<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="description" content="clownhouse.io — check back later.">
    <title>CLOWNHOUSE.IO</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        :root {
            --bg: #0a0812;
            --card: #14101f;
            --edge: #322a4d;
            --violet: #b78cff;
            --phos: #7dffa8;
            --dim: #8a80a8;
            --eye-l: #ff2d55;
            --eye-r: #b78cff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }

        /* The clown — full-page pixel art, always faintly present,
           breathing 0.11–0.17. Eyes are overlay divs that track
           the pointer inside their sockets. */
        .clown-wrap {
            position: fixed;
            top: 50%;
            left: 50%;
            height: 100vh;
            aspect-ratio: 50 / 97;
            transform: translate(-50%, -50%);
            opacity: 0;
            animation: haunt 6s ease-in forwards,
                       breathe 9s ease-in-out 6s infinite alternate;
            pointer-events: none;
            user-select: none;
        }
        .clown {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            display: block;
        }
        @keyframes haunt  { from { opacity: 0; } to { opacity: 0.14; } }
        @keyframes breathe {
            from { opacity: 0.11; }
            to   { opacity: 0.17; }
        }
        /* Vignette — drowns her edges back into the dark. */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(
                ellipse at 50% 55%,
                transparent 30%,
                var(--bg) 92%
            );
            pointer-events: none;
        }

        /* Pupils — socket centers measured from clown.png (48x95). */
        .pupil {
            position: absolute;
            width: 5.5%;
            height: 3.4%;
            transform: translate(-50%, -50%);
            transition: transform 0.16s ease-out;
        }
        .pupil.l { left: 35%; top: 20.6%; background: var(--eye-l); box-shadow: 0 0 14px 3px var(--eye-l); }
        .pupil.r { left: 67%; top: 20.6%; background: var(--eye-r); box-shadow: 0 0 14px 3px var(--eye-r); }

        body {
            background: var(--bg);
            color: var(--dim);
            font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 3rem 4rem;
            background: rgba(20, 16, 31, 0.82);
            border: 1px solid var(--edge);
            border-radius: 10px;
            box-shadow: 0 0 60px rgba(183, 140, 255, 0.07);
        }
        .word {
            font-size: clamp(1.4rem, 5vw, 2.2rem);
            letter-spacing: 0.35em;
            color: var(--violet);
            text-shadow: 0 0 12px rgba(183, 140, 255, 0.5);
            margin-bottom: 1.4rem;
        }

        /* Typewriter line — JS types/deletes into #typed, cursor
           blinks at the end. Fixed height so the card never jumps. */
        .line {
            min-height: 1.5em;
            font-size: 0.95rem;
            letter-spacing: 0.12em;
            color: var(--phos);
            text-shadow: 0 0 8px rgba(125, 255, 168, 0.35);
            white-space: nowrap;
        }
        .line::after {
            content: "_";
            margin-left: 0.15em;
            animation: blink 1.1s steps(1) infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        @media (prefers-reduced-motion: reduce) {
            .clown-wrap { animation: none; opacity: 0.14; }
            .line::after { animation: none; }
        }
    </style>
</head>
<body>
    <div class="clown-wrap" aria-hidden="true">
        <img class="clown" src="clown.png" alt="">
        <i class="pupil l" data-x="0.350" data-y="0.206"></i>
        <i class="pupil r" data-x="0.670" data-y="0.206"></i>
    </div>
    <main class="card">
        <h1 class="word">CLOWNHOUSE.IO</h1>
        <p class="line" aria-label="check back later"><span id="typed"></span></p>
    </main>
    <script>
        (() => {
            // Eyes track the pointer — each pupil leans toward the
            // cursor, travel clamped inside its socket.
            const wrap = document.querySelector('.clown-wrap');
            const ps = [...document.querySelectorAll('.pupil')].map(p => ({
                el: p, x: parseFloat(p.dataset.x), y: parseFloat(p.dataset.y)
            }));
            const MX = 0.055, MY = 0.012; // travel limits, fraction of wrap
            addEventListener('pointermove', e => {
                const r = wrap.getBoundingClientRect();
                for (const p of ps) {
                    const cx = r.left + r.width * p.x;
                    const cy = r.top + r.height * p.y;
                    const dx = e.clientX - cx, dy = e.clientY - cy;
                    const d = Math.hypot(dx, dy) || 1;
                    p.el.style.transform =
                        `translate(-50%,-50%) translate(${dx / d * r.width * MX}px,${dy / d * r.height * MY}px)`;
                }
            }, { passive: true });
            addEventListener('pointerleave', () => {
                for (const p of ps) p.el.style.transform = 'translate(-50%,-50%)';
            });

            // Typewriter — types each phrase, holds, deletes, next.
            const out = document.getElementById('typed');
            const PHRASES = [
                'check back later', 'come back soon', 'not yet, darling',
                'the house is dark', 'still cooking', 'knock again later',
                'something stirs below', 'soon, sweetheart',
                'the clown isn’t ready', 'she’s still painting her face',
                'the tent flap is sewn shut', 'no laughing yet',
                'hush — she can hear you', 'the balloons aren’t filled',
                'she’s counting to ten', 'wait by the red balloon',
                'the mirror room is empty', 'come back when the lights flicker',
                'she’s in the walls', 'the music box is winding'
            ];
            if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
                out.textContent = PHRASES[0];
                return;
            }
            let i = 0, pos = 0, del = false;
            (function tick() {
                const s = PHRASES[i];
                pos += del ? -1 : 1;
                out.textContent = s.slice(0, pos);
                if (!del && pos === s.length) { del = true; return setTimeout(tick, 1600); }
                if (del && pos === 0) {
                    del = false;
                    i = (i + 1) % PHRASES.length;
                    return setTimeout(tick, 380);
                }
                setTimeout(tick, del ? 32 : 65);
            })();
        })();
    </script>
</body>
</html>
