<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="description" content="clownhouse.io — check back later.">
    <title>CLOWNHOUSE.IO</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        :root {
            --bg: #0a0812;
            --card: #14101f;
            --edge: #322a4d;
            --violet: #b78cff;
            --phos: #7dffa8;
            --dim: #8a80a8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            background: var(--bg);
            color: var(--dim);
            font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            text-align: center;
            padding: 3rem 4rem;
            background: var(--card);
            border: 1px solid var(--edge);
            border-radius: 10px;
            box-shadow: 0 0 60px rgba(183, 140, 255, 0.07);
        }
        .word {
            font-size: clamp(1.4rem, 5vw, 2.2rem);
            letter-spacing: 0.35em;
            color: var(--violet);
            text-shadow: 0 0 12px rgba(183, 140, 255, 0.5);
            margin-bottom: 1.4rem;
        }
        .line {
            font-size: 0.95rem;
            letter-spacing: 0.12em;
            color: var(--phos);
            text-shadow: 0 0 8px rgba(125, 255, 168, 0.35);
        }
        .line::after {
            content: "_";
            animation: blink 1.1s steps(1) infinite;
        }
        .sig {
            margin-top: 2.2rem;
            font-size: 0.72rem;
            letter-spacing: 0.2em;
        }
        .sig a { color: var(--dim); text-decoration: none; }
        .sig a:hover { color: var(--violet); }
        @keyframes blink { 50% { opacity: 0; } }
        @media (prefers-reduced-motion: reduce) {
            .line::after { animation: none; }
        }
    </style>
</head>
<body>
    <main class="card">
        <h1 class="word">CLOWNHOUSE.IO</h1>
        <p class="line">check back later</p>
        <p class="sig"><a href="https://studio2201.com">A STUDIO2201 WORK</a></p>
    </main>
</body>
</html>
