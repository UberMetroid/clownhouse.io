<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="description" content="clownhouse.io — check back later.">
    <title>CLOWNHOUSE.IO</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        :root {
            --bg: #0a0812;
            --card: #14101f;
            --edge: #322a4d;
            --violet: #b78cff;
            --phos: #7dffa8;
            --dim: #8a80a8;
            --eye-l: #ff2d55;
            --eye-r: #b78cff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }

        /* The clown — full-page pixel art, always faintly present,
           breathing 0.11–0.17. Eyes are overlay divs that track
           the pointer inside their sockets. */
        .clown-wrap {
            position: fixed;
            top: 50%;
            left: 50%;
            height: 100vh;
            aspect-ratio: 48 / 95;
            transform: translate(-50%, -50%);
            opacity: 0;
            animation: haunt 6s ease-in forwards,
                       breathe 9s ease-in-out 6s infinite alternate;
            pointer-events: none;
            user-select: none;
        }
        .clown {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            display: block;
        }
        @keyframes haunt  { from { opacity: 0; } to { opacity: 0.14; } }
        @keyframes breathe {
            from { opacity: 0.11; }
            to   { opacity: 0.17; }
        }
        /* Vignette — drowns her edges back into the dark. */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(
                ellipse at 50% 55%,
                transparent 30%,
                var(--bg) 92%
            );
            pointer-events: none;
        }

        /* Pupils — socket centers measured from clown.png (48x95). */
        .pupil {
            position: absolute;
            width: 5.5%;
            height: 3.4%;
            transform: translate(-50%, -50%);
            transition: transform 0.16s ease-out;
        }
        .pupil.l { left: 37.5%; top: 21.6%; background: var(--eye-l); box-shadow: 0 0 14px 3px var(--eye-l); }
        .pupil.r { left: 70.8%; top: 21.6%; background: var(--eye-r); box-shadow: 0 0 14px 3px var(--eye-r); }

        body {
            background: var(--bg);
            color: var(--dim);
            font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 3rem 4rem;
            background: rgba(20, 16, 31, 0.82);
            border: 1px solid var(--edge);
            border-radius: 10px;
            box-shadow: 0 0 60px rgba(183, 140, 255, 0.07);
        }
        .word {
            font-size: clamp(1.4rem, 5vw, 2.2rem);
            letter-spacing: 0.35em;
            color: var(--violet);
            text-shadow: 0 0 12px rgba(183, 140, 255, 0.5);
            margin-bottom: 1.4rem;
        }

        /* Ticker — each phrase scrolls up in, holds, scrolls up out.
           8 phrases x 4s = 32s cycle; nth-child delays stagger. */
        .ticker {
            position: relative;
            height: 1.5em;
            overflow: hidden;
            font-size: 0.95rem;
            letter-spacing: 0.12em;
            color: var(--phos);
            text-shadow: 0 0 8px rgba(125, 255, 168, 0.35);
        }
        .ticker span {
            position: absolute;
            left: 0;
            right: 0;
            opacity: 0;
            transform: translateY(130%);
            animation: tick 32s cubic-bezier(0.25, 0.8, 0.3, 1) infinite;
        }
        .ticker span::after {
            content: " _";
            animation: blink 1.1s steps(1) infinite;
        }
        .ticker span:nth-child(2) { animation-delay: 4s; }
        .ticker span:nth-child(3) { animation-delay: 8s; }
        .ticker span:nth-child(4) { animation-delay: 12s; }
        .ticker span:nth-child(5) { animation-delay: 16s; }
        .ticker span:nth-child(6) { animation-delay: 20s; }
        .ticker span:nth-child(7) { animation-delay: 24s; }
        .ticker span:nth-child(8) { animation-delay: 28s; }
        @keyframes tick {
            0%    { opacity: 0; transform: translateY(130%); }
            3.5%  { opacity: 1; transform: translateY(0); }
            9.5%  { opacity: 1; transform: translateY(0); }
            12.5%, 100% { opacity: 0; transform: translateY(-130%); }
        }
        @keyframes blink { 50% { opacity: 0; } }

        @media (prefers-reduced-motion: reduce) {
            .clown-wrap { animation: none; opacity: 0.14; }
            .ticker span {
                animation: none;
                position: static;
                display: none;
            }
            .ticker span:first-child { display: inline; opacity: 1; transform: none; }
            .ticker span::after { animation: none; }
        }
    </style>
</head>
<body>
    <div class="clown-wrap" aria-hidden="true">
        <img class="clown" src="clown.png" alt="">
        <i class="pupil l" data-x="0.375" data-y="0.216"></i>
        <i class="pupil r" data-x="0.708" data-y="0.216"></i>
    </div>
    <main class="card">
        <h1 class="word">CLOWNHOUSE.IO</h1>
        <p class="ticker" aria-label="check back later">
            <span>check back later</span>
            <span>come back soon</span>
            <span>not yet, darling</span>
            <span>the house is dark</span>
            <span>still cooking</span>
            <span>knock again later</span>
            <span>something stirs below</span>
            <span>soon, sweetheart</span>
        </p>
    </main>
    <script>
        // Eyes track the pointer — each pupil leans toward the cursor,
        // travel clamped inside its socket. The only JS on the page.
        (() => {
            if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            const wrap = document.querySelector('.clown-wrap');
            const ps = [...document.querySelectorAll('.pupil')].map(p => ({
                el: p, x: parseFloat(p.dataset.x), y: parseFloat(p.dataset.y)
            }));
            const MX = 0.055, MY = 0.012; // travel limits, fraction of wrap
            addEventListener('pointermove', e => {
                const r = wrap.getBoundingClientRect();
                for (const p of ps) {
                    const cx = r.left + r.width * p.x;
                    const cy = r.top + r.height * p.y;
                    const dx = e.clientX - cx, dy = e.clientY - cy;
                    const d = Math.hypot(dx, dy) || 1;
                    p.el.style.transform =
                        `translate(-50%,-50%) translate(${dx / d * r.width * MX}px,${dy / d * r.height * MY}px)`;
                }
            }, { passive: true });
            addEventListener('pointerleave', () => {
                for (const p of ps) p.el.style.transform = 'translate(-50%,-50%)';
            });
        })();
    </script>
</body>
</html>
