<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="description" content="clownhouse.io — check back later.">
    <title>CLOWNHOUSE.IO</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        :root {
            --bg: #0a0812;
            --card: #14101f;
            --edge: #322a4d;
            --violet: #b78cff;
            --phos: #7dffa8;
            --dim: #8a80a8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }

        /* The clown — full-page pixel art, barely-there, slow fade. */
        .clown {
            position: fixed;
            top: 50%;
            left: 50%;
            height: 100vh;
            width: auto;
            max-width: none;
            transform: translate(-50%, -50%);
            image-rendering: pixelated;
            opacity: 0;
            animation: haunt 12s ease-in 2s forwards;
            pointer-events: none;
            user-select: none;
        }
        @keyframes haunt {
            from { opacity: 0; }
            to   { opacity: 0.13; }
        }
        /* Vignette — drowns the clown's edges back into the dark. */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(
                ellipse at 50% 55%,
                transparent 30%,
                var(--bg) 92%
            );
            pointer-events: none;
        }

        body {
            background: var(--bg);
            color: var(--dim);
            font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 3rem 4rem;
            background: rgba(20, 16, 31, 0.82);
            border: 1px solid var(--edge);
            border-radius: 10px;
            box-shadow: 0 0 60px rgba(183, 140, 255, 0.07);
        }
        .word {
            font-size: clamp(1.4rem, 5vw, 2.2rem);
            letter-spacing: 0.35em;
            color: var(--violet);
            text-shadow: 0 0 12px rgba(183, 140, 255, 0.5);
            margin-bottom: 1.4rem;
        }

        /* Ticker — each phrase scrolls up in, holds, scrolls up out.
           8 phrases x 4s = 32s cycle; nth-child delays stagger. */
        .ticker {
            position: relative;
            height: 1.5em;
            overflow: hidden;
            font-size: 0.95rem;
            letter-spacing: 0.12em;
            color: var(--phos);
            text-shadow: 0 0 8px rgba(125, 255, 168, 0.35);
        }
        .ticker span {
            position: absolute;
            left: 0;
            right: 0;
            opacity: 0;
            transform: translateY(130%);
            animation: tick 32s cubic-bezier(0.25, 0.8, 0.3, 1) infinite;
        }
        .ticker span::after {
            content: " _";
            animation: blink 1.1s steps(1) infinite;
        }
        .ticker span:nth-child(2) { animation-delay: 4s; }
        .ticker span:nth-child(3) { animation-delay: 8s; }
        .ticker span:nth-child(4) { animation-delay: 12s; }
        .ticker span:nth-child(5) { animation-delay: 16s; }
        .ticker span:nth-child(6) { animation-delay: 20s; }
        .ticker span:nth-child(7) { animation-delay: 24s; }
        .ticker span:nth-child(8) { animation-delay: 28s; }
        @keyframes tick {
            0%    { opacity: 0; transform: translateY(130%); }
            3.5%  { opacity: 1; transform: translateY(0); }
            9.5%  { opacity: 1; transform: translateY(0); }
            12.5%, 100% { opacity: 0; transform: translateY(-130%); }
        }
        @keyframes blink { 50% { opacity: 0; } }

        @media (prefers-reduced-motion: reduce) {
            .clown { animation: none; opacity: 0.13; }
            .ticker span {
                animation: none;
                position: static;
                display: none;
            }
            .ticker span:first-child { display: inline; opacity: 1; transform: none; }
        }
    </style>
</head>
<body>
    <img class="clown" src="clown.png" alt="" aria-hidden="true">
    <main class="card">
        <h1 class="word">CLOWNHOUSE.IO</h1>
        <p class="ticker" aria-label="check back later">
            <span>check back later</span>
            <span>come back soon</span>
            <span>not yet, darling</span>
            <span>the house is dark</span>
            <span>still cooking</span>
            <span>knock again later</span>
            <span>something stirs below</span>
            <span>soon, sweetheart</span>
        </p>
    </main>
</body>
</html>
