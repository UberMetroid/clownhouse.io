<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="description" content="clownhouse.io — sanctuary in the belfry. check back later.">
  <meta name="theme-color" content="#06050b">
  <link rel="canonical" href="https://clownhouse.io/">
  <title>CLOWNHOUSE.IO // SANCTUARY</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta property="og:site_name" content="clownhouse.io">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://clownhouse.io/">
  <meta property="og:title" content="CLOWNHOUSE.IO">
  <meta property="og:description" content="the music box is winding in the dark.">
  <meta property="og:image" content="https://clownhouse.io/house.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="CLOWNHOUSE.IO">
  <meta name="twitter:description" content="the music box is winding in the dark.">
  <meta name="twitter:image" content="https://clownhouse.io/house.png">
  <style>
    :root {
      --bg: #06050b;
      --panel: rgba(13, 11, 22, 0.88);
      --panel-alt: rgba(19, 16, 32, 0.92);
      --border: #221c35;
      --border-subtle: #1d182e;
      --text: #f3f4f6;
      --text-secondary: #a39bb8;
      --muted: #7c7396;
      --text-dim: #4e4666;
      --phosphor: #bd93f9;
      --accent: #bd93f9;
      --accent-rgb: 189, 147, 249;
      --phosphor-dim: rgba(189, 147, 249, 0.14);
      --phosphor-glow: rgba(189, 147, 249, 0.32);
      --border-accent: rgba(189, 147, 249, 0.42);
      --hot: #d9b8ff;
      --hot-rgb: 217, 184, 255;
      --cyan: #00e5ff;
      --crimson: #ff2d55;
      --emerald: #50fa7b;
      --spotlight-border: rgba(189, 147, 249, 0.56);
      --spotlight-glow: rgba(217, 184, 255, 0.94);
      --spotlight-inner: rgba(189, 147, 249, 0.055);
      --mono: ui-monospace, SFMono-Regular, "JetBrains Mono", "Cascadia Mono", "Fira Code", Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 58px 16px 56px;
      position: relative;
    }

    /* Full-Viewport Bayer 8x8 Ordered-Dither & Pixel Haunted Manor Canvas */
    .spotlight-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      display: block;
      cursor: crosshair;
    }

    /* Vignette — drowns the extreme edges back into the night */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 52%, transparent 52%, rgba(4, 3, 8, 0.78) 96%);
      pointer-events: none;
      z-index: 1;
    }

    /* Top Scanline Header Bar with Jester Crest + Smart Whisper Typewriter */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      min-height: 50px;
      background: rgba(8, 6, 15, 0.92);
      background-image: linear-gradient(rgba(18, 14, 28, 0) 50%, rgba(0, 0, 0, 0.42) 50%);
      background-size: 100% 4px;
      border-bottom: 2px solid var(--border-accent);
      box-shadow: 0 2px 0 0 rgba(0, 0, 0, 0.85), 0 8px 24px rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 95;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 1rem;
    }
    .site-header-inner {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .brand-left {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex-shrink: 0;
    }
    .crest-emblem {
      width: 34px;
      height: 34px;
      border-radius: 7px;
      border: 1.5px solid var(--phosphor);
      box-shadow: 0 0 12px var(--phosphor-dim);
      background: #090710;
      flex-shrink: 0;
      display: block;
    }
    .header-wordmark {
      display: block;
      width: min(210px, 42vw);
      height: auto;
      image-rendering: pixelated;
    }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    /* Smart Whisper Typewriter Line in Header */
    .header-whisper {
      flex: 1;
      max-width: 540px;
      padding: 0.35rem 0.75rem;
      background: rgba(4, 3, 8, 0.85);
      border: 1px solid var(--border);
      border-left: 3px solid var(--phosphor);
      border-radius: 5px;
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }
    .whisper-prompt {
      color: var(--muted);
      font-size: 0.74rem;
      user-select: none;
      flex-shrink: 0;
    }
    .line {
      flex: 1;
      min-height: 1.35em;
      font-size: 0.82rem;
      letter-spacing: 0.06em;
      color: var(--emerald);
      text-shadow: 0 0 8px rgba(80, 250, 123, 0.35);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .line::after {
      content: "█";
      margin-left: 0.18em;
      font-size: 0.78em;
      color: var(--phosphor);
      animation: blink 1.05s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* Unobstructed Haunted Manor Stage + Binary Wordmark Anchor in Upper Sky */
    .stage-wrap {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 880px;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      margin-top: clamp(8px, 2.5vh, 28px);
    }
    .wordmark-hero {
      width: 100%;
      height: clamp(64px, 11vh, 108px);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      pointer-events: none;
      user-select: none;
    }

    /* Bottom Scanline .footer-dock with [1]-[3] Arcade Triggers & 8-Swatch Palette Switcher */
    .footer-dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      min-height: 48px;
      background: rgba(8, 6, 15, 0.96);
      background-image: linear-gradient(rgba(18, 14, 28, 0) 50%, rgba(0, 0, 0, 0.45) 50%);
      background-size: 100% 4px;
      border-top: 2px solid var(--border-accent);
      box-shadow: 0 -2px 0 0 rgba(0, 0, 0, 0.85), 0 -8px 24px rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 95;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px 1rem;
    }
    .footer-dock-inner {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    /* Interactive [1]-[3] Arcade Trigger Row in Footer */
    .arcade-triggers {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }
    .arcade-btn {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text);
      background: #100d1c;
      border: 1.5px solid var(--border-accent);
      box-shadow: 2px 2px 0 0 #000;
      border-radius: 4px;
      padding: 5px 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
      transition: all 0.12s steps(2);
    }
    .arcade-btn:hover {
      background: var(--phosphor-dim);
      border-color: var(--hot);
      color: var(--hot);
      box-shadow: 2px 2px 0 0 #000, 0 0 12px var(--phosphor-glow);
      transform: translateY(-1px);
    }
    .arcade-btn.active {
      background: var(--phosphor);
      color: #05040a;
      border-color: #ffffff;
      box-shadow: 0 0 14px var(--phosphor-glow);
    }
    .arcade-key {
      color: var(--hot);
      font-weight: 700;
    }
    .arcade-btn.active .arcade-key {
      color: #05040a;
    }

    .dock-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }
    .dock-swatch-label {
      font-size: 10px;
      color: var(--hot);
      letter-spacing: 0.08em;
      font-weight: 700;
      min-width: 54px;
      text-align: right;
    }
    .footer-accent-picker {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 7px;
      background: #090710;
      border: 1px solid var(--border-subtle);
      box-shadow: inset 1px 1px 0 0 #000;
    }
    .dock-accent-dot {
      width: 11px;
      height: 11px;
      border-radius: 1px;
      border: 1px solid #000;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.22);
      cursor: pointer;
      padding: 0;
      display: inline-block;
      transition: transform 0.1s steps(2), box-shadow 0.1s steps(2);
    }
    .dock-accent-dot:hover {
      transform: scale(1.22);
      box-shadow: 0 0 0 1px #fff, 0 0 8px var(--swatch, currentColor);
    }
    .dock-accent-dot.active {
      transform: scale(1.32);
      box-shadow: 0 0 0 2px #fff, 0 0 12px var(--swatch, currentColor);
      border-color: #fff;
    }

    @media (max-width: 680px) {
      .site-header-inner {
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
      }
      .header-whisper {
        max-width: 100%;
      }
      body {
        padding-top: 88px;
      }
      .dock-swatch-label { display: none; }
      .arcade-btn { padding: 4px 7px; font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .line::after { animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="spotlight-canvas" class="spotlight-canvas" aria-hidden="true"></canvas>

  <header class="site-header">
    <div class="site-header-inner">
      <div class="brand-left">
        <img class="crest-emblem" src="favicon.svg" alt="" width="34" height="34">
        <canvas id="header-wordmark" class="header-wordmark" width="342" height="51" aria-label="CLOWNHOUSE"></canvas>
        <h1 class="visually-hidden">CLOWNHOUSE.IO</h1>
      </div>
      <div class="header-whisper" aria-live="polite">
        <span class="whisper-prompt">whisper://</span>
        <p class="line" aria-label="check back later"><span id="typed">check back later</span></p>
      </div>
    </div>
  </header>

  <main class="stage-wrap">
    <div class="wordmark-hero" id="wordmark-hero" aria-hidden="true"></div>
  </main>

  <nav class="footer-dock" id="footer-dock" aria-label="Sanctuary Controls and 8-Bit Theme Palette Dock">
    <div class="footer-dock-inner">
      <div class="arcade-triggers" role="group" aria-label="Sanctuary Interactive Triggers">
        <button type="button" class="arcade-btn" id="act-knock" title="Knock on the manor door (Key: 1)">
          <span class="arcade-key">[1]</span> Knock
        </button>
        <button type="button" class="arcade-btn" id="act-music" aria-pressed="false" title="Toggle dark music-box synth loop (Key: 2)">
          <span class="arcade-key">[2]</span> Music Box
        </button>
        <button type="button" class="arcade-btn" id="act-storm" title="Fire pixel lightning bolt across the sky (Key: 3)">
          <span class="arcade-key">[3]</span> Storm
        </button>
      </div>
      <div class="dock-controls">
        <span class="dock-swatch-label" id="dock-swatch-name">VIOLET</span>
        <div class="footer-accent-picker" id="footer-accent-picker" role="radiogroup" aria-label="8-Bit Rainbow Palette">
          <button type="button" class="dock-accent-dot" data-accent-name="Coral" style="--swatch:#ff5555;background-color:#ff5555;" role="radio" aria-checked="false" tabindex="-1" aria-label="Coral" title="Coral"></button>
          <button type="button" class="dock-accent-dot" data-accent-name="Orange" style="--swatch:#ff7700;background-color:#ff7700;" role="radio" aria-checked="false" tabindex="-1" aria-label="Orange" title="Orange"></button>
          <button type="button" class="dock-accent-dot" data-accent-name="Amber" style="--swatch:#ffb000;background-color:#ffb000;" role="radio" aria-checked="false" tabindex="-1" aria-label="Amber" title="Amber"></button>
          <button type="button" class="dock-accent-dot" data-accent-name="Yellow" style="--swatch:#f1fa8c;background-color:#f1fa8c;" role="radio" aria-checked="false" tabindex="-1" aria-label="Yellow" title="Yellow"></button>
          <button type="button" class="dock-accent-dot" data-accent-name="Emerald" style="--swatch:#50fa7b;background-color:#50fa7b;" role="radio" aria-checked="false" tabindex="-1" aria-label="Emerald" title="Emerald"></button>
          <button type="button" class="dock-accent-dot" data-accent-name="Cyan" style="--swatch:#00e5ff;background-color:#00e5ff;" role="radio" aria-checked="false" tabindex="-1" aria-label="Cyan" title="Cyan"></button>
          <button type="button" class="dock-accent-dot" data-accent-name="Blue" style="--swatch:#3b82f6;background-color:#3b82f6;" role="radio" aria-checked="false" tabindex="-1" aria-label="Blue" title="Blue"></button>
          <button type="button" class="dock-accent-dot active" data-accent-name="Violet" style="--swatch:#bd93f9;background-color:#bd93f9;" role="radio" aria-checked="true" tabindex="0" aria-label="Violet" title="Violet"></button>
        </div>
      </div>
    </div>
  </nav>

  <script src="fx.js" defer></script>
</body>
</html>
