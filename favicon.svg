<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <rect width="32" height="32" fill="#352879"/>
  <!-- 5.25 inch floppy disk / 1982 micro aesthetic -->
  <rect x="4" y="4" width="24" height="24" fill="#181045" stroke="#6c5eb5" stroke-width="1"/>
  <!-- Floppy label -->
  <rect x="7" y="6" width="18" height="8" fill="#ffffff"/>
  <rect x="9" y="8" width="14" height="2" fill="#e75854"/>
  <rect x="9" y="11" width="10" height="1" fill="#40318d"/>
  <!-- Read head slot -->
  <rect x="13" y="18" width="6" height="8" rx="3" fill="#000000"/>
  <!-- Hub hole -->
  <circle cx="16" cy="17" r="2.5" fill="#352879"/>
</svg>
