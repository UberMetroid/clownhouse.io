  <!-- Shell Container: Command Palette Modal -->
  <div id="command-palette-modal" class="command-palette-modal hidden" role="dialog" aria-modal="true" aria-labelledby="palette-input">
    <div class="palette-backdrop" id="palette-backdrop"></div>
    <div class="palette-dialog" id="palette-dialog">
      <div class="palette-search-box">
        <svg class="palette-search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="palette-input" placeholder="Type a command, project, theme, or service..." autocomplete="off" spellcheck="false">
        <kbd class="palette-esc-badge" id="palette-close-badge">ESC</kbd>
      </div>

      <div id="palette-results" class="palette-results" role="listbox">
        <!-- Results populated dynamically by app.js -->
      </div>

      <div class="palette-footer">
        <span class="palette-hint"><kbd>↑</kbd> <kbd>↓</kbd> Navigate</span>
        <span class="palette-hint"><kbd>↵</kbd> Select</span>
        <span class="palette-hint"><kbd>ESC</kbd> Close</span>
      </div>
    </div>
  </div>
</body>
