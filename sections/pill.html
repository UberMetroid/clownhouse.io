  <!-- Shell Container: Floating Audio Player Pill -->
  <aside id="floating-audio-pill" class="floating-audio-pill" aria-label="Floating Ambient Audio Player">
    <button id="audio-play-btn" class="audio-play-btn" aria-label="Play procedural ambient audio" title="Play / Pause Ambient Audio (Space)">
      <img src="favicon.svg" alt="clownhouse.io" class="audio-art-img" width="38" height="38">
      <span class="audio-play-overlay">
        <svg id="audio-play-icon" class="audio-icon" viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
          <polygon points="5,3 19,12 5,21"/>
        </svg>
        <svg id="audio-pause-icon" class="audio-icon hidden" viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
          <rect x="6" y="4" width="4" height="16"/>
          <rect x="14" y="4" width="4" height="16"/>
        </svg>
      </span>
    </button>

    <div id="audio-track-info" class="audio-track-info">
      <span id="audio-track-title" class="audio-track-title">Carrier Drift</span>
      <span id="audio-track-freq" class="audio-track-freq">LAB-01 · 55Hz Sub / 432Hz Carrier</span>
    </div>

    <div id="audio-eq-bars" class="audio-eq-bars" aria-hidden="true" title="Real-time Analyser Equalizer">
      <span class="eq-bar bar-1"></span>
      <span class="eq-bar bar-2"></span>
      <span class="eq-bar bar-3"></span>
      <span class="eq-bar bar-4"></span>
    </div>

    <button id="audio-mute-btn" class="audio-mute-btn" aria-label="Toggle mute" title="Mute / Unmute Audio">
      <svg id="audio-unmuted-icon" class="audio-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
      </svg>
      <svg id="audio-muted-icon" class="audio-icon hidden" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/>
        <line x1="23" y1="9" x2="17" y2="15"/>
        <line x1="17" y1="9" x2="23" y2="15"/>
      </svg>
    </button>
  </aside>
