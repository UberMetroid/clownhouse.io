<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="description" content="clownhouse.io — 404 not found.">
    <meta name="theme-color" content="#0a0812">
    <title>404 · CLOWNHOUSE.IO</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <meta property="og:site_name" content="clownhouse.io">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://clownhouse.io/404.html">
    <meta property="og:title" content="404 · CLOWNHOUSE.IO">
    <meta property="og:description" content="you wandered into the wrong room, darling.">
    <meta property="og:image" content="https://clownhouse.io/house.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="404 · CLOWNHOUSE.IO">
    <meta name="twitter:description" content="you wandered into the wrong room, darling.">
    <meta name="twitter:image" content="https://clownhouse.io/house.png">
    <style>
        :root {
            --bg: #0a0812;
            --card: rgba(20, 16, 31, 0.82);
            --edge: #322a4d;
            --violet: #b78cff;
            --phos: #7dffa8;
            --dim: #8a80a8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }

        .house-wrap {
            position: fixed;
            inset: 0;
            opacity: 0;
            animation: haunt 6s ease-in forwards,
                       breathe 9s ease-in-out 6s infinite alternate;
            pointer-events: none;
            user-select: none;
        }
        .house {
            width: 100%;
            height: 100%;
            object-fit: fill;
            image-rendering: pixelated;
            display: block;
        }
        @keyframes haunt  { from { opacity: 0; } to { opacity: 0.14; } }
        @keyframes breathe {
            from { opacity: 0.14; }
            to   { opacity: 0.22; }
        }
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(
                ellipse at 50% 55%,
                transparent 30%,
                var(--bg) 92%
            );
            pointer-events: none;
        }
        body {
            background: var(--bg);
            color: var(--dim);
            font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 3rem clamp(1.2rem, 8vw, 4rem);
            background: var(--card);
            border: 1px solid var(--edge);
            border-radius: 10px;
            box-shadow: 0 0 60px rgba(183, 140, 255, 0.07);
        }
        .word {
            font-size: clamp(1.4rem, 5vw, 2.2rem);
            letter-spacing: 0.35em;
            color: var(--violet);
            text-shadow: 0 0 12px rgba(183, 140, 255, 0.5);
            margin-bottom: 1.4rem;
        }
        .line {
            min-height: 1.5em;
            font-size: 0.95rem;
            letter-spacing: 0.12em;
            color: var(--phos);
            text-shadow: 0 0 8px rgba(125, 255, 168, 0.35);
            white-space: nowrap;
            margin-bottom: 2rem;
        }
        .line::after {
            content: "_";
            margin-left: 0.15em;
            animation: blink 1.1s steps(1) infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .door-btn {
            display: inline-block;
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            color: var(--dim);
            text-decoration: none;
            border: 1px solid var(--edge);
            padding: 8px 18px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }
        .door-btn:hover {
            color: var(--violet);
            border-color: var(--violet);
            background: rgba(183, 140, 255, 0.08);
            box-shadow: 0 0 15px rgba(183, 140, 255, 0.2);
        }

        #fx {
            position: fixed;
            inset: 0;
            z-index: 3;
            pointer-events: none;
        }
        @media (prefers-reduced-motion: reduce) {
            .house-wrap { animation: none; opacity: 0.18; }
            .line::after { animation: none; }
        }
    </style>
</head>
<body>
    <div class="house-wrap" aria-hidden="true">
        <img class="house" src="house.png" alt="">
    </div>
    <main class="card">
        <h1 class="word">404</h1>
        <p class="line" aria-label="wrong room, darling"><span id="typed"></span></p>
        <a class="door-btn" href="/">← the front door</a>
    </main>
    <canvas id="fx" aria-hidden="true"></canvas>
    <script src="fx.js" defer></script>
    <script>
        (() => {
            const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
            const out = document.getElementById('typed');
            const PHRASES = [
                'wrong room, darling', 'nothing here but dust',
                'this door wasn’t on the blueprint', 'she was never in this room',
                'turn around', 'the hallway ended twenty steps ago',
                'step back into the light', 'you weren’t supposed to open this'
            ];
            if (reduced) {
                out.textContent = PHRASES[0];
                return;
            }
            let i = 0, pos = 0, del = false;
            (function tick() {
                const s = PHRASES[i];
                pos += del ? -1 : 1;
                out.textContent = s.slice(0, pos);
                if (!del && pos === s.length) { del = true; return setTimeout(tick, 1800); }
                if (del && pos === 0) {
                    del = false;
                    i = (i + 1) % PHRASES.length;
                    return setTimeout(tick, 380);
                }
                setTimeout(tick, del ? 32 : 65);
            })();
        })();
    </script>
</body>
</html>
